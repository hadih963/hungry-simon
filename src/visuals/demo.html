<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hungry Simon · device visual demo</title>
  <link rel="stylesheet" href="../../styles/device.css">
  <style>
    body{margin:0;padding:28px 20px 50px;background:#f6efe3;color:#1f2430;font-family:system-ui,sans-serif}main{max-width:1080px;margin:auto}h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}p{margin:0 0 20px;color:#635846}.panel{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0 24px}.panel button{border:2px solid #1f2430;border-radius:12px;background:#fff8ed;padding:9px 14px;color:#1f2430;font:700 14px system-ui;cursor:pointer;box-shadow:0 3px #b79065}.panel button:active{transform:translateY(2px);box-shadow:0 1px #b79065}.panel input{accent-color:#ff6a1a}.control{display:flex;align-items:center;gap:9px;padding:8px 13px;border:1px solid #d8c9b3;border-radius:12px;background:#fbf7f0;font-weight:650}.hs-demo-wrap{padding:8px 0}
  </style>
</head>
<body><main>
  <h1>Hungry Simon</h1><p>Illustrated device controls — tap a key or use the buttons to explore its visual states.</p>
  <div class="hs-demo-wrap" id="device"></div>
  <div class="panel" aria-label="Device controls">
    <button id="leds">Rainbow LEDs</button><button id="flash">Flash all</button><button id="presence">Toggle presence</button><button id="sleep">Sleep / wake</button>
    <label class="control">Treat level <input id="level" type="range" min="0" max="100" value="75"></label>
    <button id="dispense">Dispense treat</button><button id="pet">Pet mode</button><button id="speaker">Pulse speaker</button><label class="control">Volume <input id="volume" type="range" min="0" max="100" value="70"></label>
  </div>
</main>
<script type="module">
  import { createDevice } from './device.js';
  const names=['Do','Re','Mi','Fa','Sol','La','Si',"Do′"];
  const d=createDevice(document.querySelector('#device'),{keyCount:8,keyNames:names});
  let present=false,awake=true,pet=false;
  d.onKeyInput((i,down)=>{if(down){d.setKeyLed(i,['#ff4d4d','#ff9f1c','#ffd60a','#3ddc84','#2ec4b6','#3a86ff','#8338ec','#ff5fa2'][i],.9);d.pulseSpeaker();}else d.setKeyLed(i,null,0);});
  d.onPresenceToggle(()=>{present=!present;d.setPresence(present);});
  document.querySelector('#leds').onclick=()=>names.forEach((_,i)=>d.setKeyLed(i,['#ff4d4d','#ff9f1c','#ffd60a','#3ddc84','#2ec4b6','#3a86ff','#8338ec','#ff5fa2'][i],.85));
  document.querySelector('#flash').onclick=()=>d.flashAll('#ff6a1a',650);
  document.querySelector('#presence').onclick=()=>{present=!present;d.setPresence(present);};
  document.querySelector('#sleep').onclick=()=>{awake=!awake;d.setAwake(awake);};
  document.querySelector('#level').oninput=e=>d.setTreatLevel(e.target.value/100);
  document.querySelector('#dispense').onclick=()=>d.dispense();
  document.querySelector('#pet').onclick=()=>{pet=!pet;d.setPetMode(pet);};
  document.querySelector('#speaker').onclick=()=>d.pulseSpeaker();
  document.querySelector('#volume').oninput=e=>d.setVolume(e.target.value/100);
  const c=d.getDisplayCanvas(),ctx=c.getContext('2d');
  ctx.fillStyle='#111722';ctx.fillRect(0,0,480,160);ctx.fillStyle='#f6d18b';ctx.font='bold 16px system-ui';ctx.fillText('HUNGRY SIMON · DEMO DISPLAY',18,28);
  ctx.strokeStyle='#ff9f1c';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(20,130);ctx.lineTo(90,104);ctx.lineTo(160,130);ctx.lineTo(230,78);ctx.lineTo(300,105);ctx.lineTo(375,60);ctx.lineTo(460,86);ctx.stroke();
  ['#ff4d4d','#ff9f1c','#ffd60a','#3ddc84','#2ec4b6','#3a86ff','#8338ec','#ff5fa2'].forEach((x,i)=>{ctx.fillStyle=x;ctx.beginPath();ctx.arc(40+i*56,130-(i%3)*20,6,0,Math.PI*2);ctx.fill();});
</script></body></html>
